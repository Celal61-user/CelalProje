<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LRP Yönetim Paneli</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/auth.js"></script>
    <script>
        requireRole("Admin");
    </script>
</head>
<body class="lrp-body">
    <div class="lrp-shell">
        <aside class="lrp-sidebar">
            <div class="lrp-brand">
                <div class="lrp-brand-badge">LRP</div>
                <div>
                    <div class="lrp-brand-step">Aşama 1</div>
                    <h1>Yönetim Paneli</h1>
                </div>
            </div>

            <p class="lrp-sidebar-text">Laboratuvar, bilgisayar ve öğrenci yönetimini tek ekrandan yönetin.</p>

            <nav class="lrp-nav" id="sidebarNav">
                <button class="lrp-nav-button active" data-page="dashboard" type="button">Gösterge Paneli</button>
                <button class="lrp-nav-button" data-page="labs" type="button">Laboratuvarlar</button>
                <button class="lrp-nav-button" data-page="computers" type="button">Bilgisayarlar</button>
                <button class="lrp-nav-button" data-page="students" type="button">Öğrenciler</button>
            </nav>

            <div class="lrp-sidebar-footer">
                <div class="lrp-sidebar-label">Oturum</div>
                <div class="lrp-sidebar-user" id="adminWelcome"></div>
                <button class="lrp-button lrp-button-warn lrp-button-block" id="logoutButton" type="button">Çıkış Yap</button>
            </div>
        </aside>

        <main class="lrp-main">
            <section class="lrp-topbar">
                <div>
                    <div class="lrp-topbar-label" id="pageEyebrow">Yönetim</div>
                    <h2 id="pageTitle">Gösterge Paneli</h2>
                </div>
                <div class="lrp-topbar-actions">
                    <span class="lrp-pill lrp-pill-success" id="systemStatus">Hazır</span>
                    <button class="lrp-button" id="primaryActionButton" type="button" hidden></button>
                </div>
            </section>

            <div id="pageContent" class="lrp-page-content"></div>
        </main>
    </div>

    <div class="lrp-modal-backdrop" id="labModal">
        <div class="lrp-modal">
            <form id="labForm" class="lrp-form">
                <div class="lrp-modal-header">
                    <h3>Laboratuvar Kaydı</h3>
                    <button class="lrp-close-button" data-close-modal="labModal" type="button">×</button>
                </div>
                <input type="hidden" id="labId">
                <label>Laboratuvar Adı<input id="labName" required></label>
                <label>Konum<input id="labLocation" required></label>
                <label>Kapasite<input id="labCapacity" type="number" min="1" required></label>
                <div class="lrp-form-actions">
                    <button class="lrp-button lrp-button-ghost" data-close-modal="labModal" type="button">İptal</button>
                    <button class="lrp-button" type="submit">Kaydet</button>
                </div>
            </form>
        </div>
    </div>

    <div class="lrp-modal-backdrop" id="computerModal">
        <div class="lrp-modal lrp-modal-wide">
            <form id="computerForm" class="lrp-form">
                <div class="lrp-modal-header">
                    <h3>Bilgisayar Kaydı</h3>
                    <button class="lrp-close-button" data-close-modal="computerModal" type="button">×</button>
                </div>
                <input type="hidden" id="computerId">
                <div class="lrp-grid-2">
                    <label>Bilgisayar Adı<input id="computerName" required></label>
                    <label>Marka<input id="computerBrand" required></label>
                    <label>İşlemci<input id="computerProcessor" required></label>
                    <label>RAM (GB)<input id="computerRamGb" type="number" min="1" required></label>
                    <label>Seri Numarası<input id="computerSerialNumber" required></label>
                    <label>Durum
                        <select id="computerStatus">
                            <option value="1">Aktif</option>
                            <option value="2">Bakımda</option>
                            <option value="3">Pasif</option>
                        </select>
                    </label>
                    <label>Laboratuvar<select id="computerLabId" required></select></label>
                    <label>Sorumlu Öğrenci<select id="computerStudentId"></select></label>
                </div>
                <div class="lrp-checkbox-row">
                    <label class="lrp-checkbox"><input id="computerHasHdmi" type="checkbox"> HDMI Var</label>
                    <label class="lrp-checkbox"><input id="computerHasVeyon" type="checkbox"> Veyon Kurulu</label>
                </div>
                <div class="lrp-form-actions">
                    <button class="lrp-button lrp-button-ghost" data-close-modal="computerModal" type="button">İptal</button>
                    <button class="lrp-button" type="submit">Kaydet</button>
                </div>
            </form>
        </div>
    </div>

    <div class="lrp-modal-backdrop" id="studentModal">
        <div class="lrp-modal">
            <form id="studentForm" class="lrp-form">
                <div class="lrp-modal-header">
                    <h3>Öğrenci Kaydı</h3>
                    <button class="lrp-close-button" data-close-modal="studentModal" type="button">×</button>
                </div>
                <input type="hidden" id="studentId">
                <label>Ad<input id="studentFirstName" required></label>
                <label>Soyad<input id="studentLastName" required></label>
                <label>Öğrenci No<input id="studentNumber" required></label>
                <label>E-posta<input id="studentEmail" type="email" required></label>
                <div class="lrp-form-actions">
                    <button class="lrp-button lrp-button-ghost" data-close-modal="studentModal" type="button">İptal</button>
                    <button class="lrp-button" type="submit">Kaydet</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/app.js" defer></script>
</body>
</html>
