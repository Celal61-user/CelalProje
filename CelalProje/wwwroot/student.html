<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LRP Öğrenci Paneli</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/auth.js"></script>
    <script>
        requireRole("Student");
    </script>
</head>
<body>
    <div class="page-shell">
        <header class="hero">
            <div>
                <p class="eyebrow">Öğrenci Paneli</p>
                <h1>LRP Öğrenci Ekranı</h1>
                <p class="hero-copy">Zimmetinize atanmış bilgisayarın teknik özelliklerini bu panelden görebilirsiniz.</p>
            </div>
            <div class="hero-badge">
                <span>Aktif Rol</span>
                <strong id="studentRole">Student</strong>
            </div>
        </header>

        <section class="toolbar">
            <div id="studentWelcome" class="toolbar-text"></div>
            <button id="logoutButton">Çıkış Yap</button>
        </section>

        <section class="stats-grid" id="studentStats"></section>

        <main class="content-grid">
            <section class="panel student-panel">
                <div class="panel-header">
                    <h2>Zimmetli Bilgisayarım</h2>
                </div>
                <div id="studentComputerCards" class="card-list"></div>
            </section>

            <section class="panel">
                <div class="panel-header">
                    <h2>Teknik Özellikler</h2>
                </div>
                <div id="studentComputerTable" class="table-wrap"></div>
            </section>
        </main>
    </div>
    <script src="/student.js"></script>
</body>
</html>
