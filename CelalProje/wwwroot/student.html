<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LRP Öğrenci Paneli</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/auth.js"></script>
    <script>
        requireRole("Student");
    </script>
</head>
<body class="lrp-body">
    <div class="lrp-shell">
        <aside class="lrp-sidebar">
            <div class="lrp-brand">
                <div class="lrp-brand-badge">LRP</div>
                <div>
                    <div class="lrp-brand-step">Öğrenci</div>
                    <h1>Öğrenci Paneli</h1>
                </div>
            </div>

            <p class="lrp-sidebar-text">Zimmetinize atanmış bilgisayarın teknik özelliklerini buradan görüntüleyin.</p>

            <nav class="lrp-nav" id="studentSidebarNav">
                <button class="lrp-nav-button active" data-page="overview" type="button">Genel Bakış</button>
                <button class="lrp-nav-button" data-page="details" type="button">Teknik Detaylar</button>
            </nav>

            <div class="lrp-sidebar-footer">
                <div class="lrp-sidebar-label">Oturum</div>
                <div class="lrp-sidebar-user" id="studentWelcome"></div>
                <button class="lrp-button lrp-button-warn lrp-button-block" id="logoutButton" type="button">Çıkış Yap</button>
            </div>
        </aside>

        <main class="lrp-main">
            <section class="lrp-topbar">
                <div>
                    <div class="lrp-topbar-label" id="studentPageEyebrow">Portal</div>
                    <h2 id="studentPageTitle">Genel Bakış</h2>
                </div>
                <div class="lrp-topbar-actions">
                    <span class="lrp-pill lrp-pill-success">Öğrenci Erişimi</span>
                </div>
            </section>

            <div id="studentPageContent" class="lrp-page-content"></div>
        </main>
    </div>

    <script src="/student.js" defer></script>
</body>
</html>
