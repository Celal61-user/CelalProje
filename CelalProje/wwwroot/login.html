<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LRP Giriş</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="lrp-body">
    <div class="lrp-login-shell">
        <section class="lrp-login-card">
            <div class="lrp-login-badge">LRP</div>
            <p class="lrp-login-step">Laboratuvar Kaynak Planlama</p>
            <h1>Sisteme Giriş Yap</h1>
            <p class="lrp-login-text">Yönetici ve öğrenci girişleri rol bazlı olarak yönlendirilir.</p>

            <form id="loginForm" class="lrp-form">
                <label>Kullanıcı Adı<input id="username" required></label>
                <label>Şifre<input id="password" type="password" required></label>
                <button class="lrp-button lrp-button-block" type="submit">Giriş Yap</button>
                <p id="loginError" class="lrp-error-text"></p>
            </form>

            <div class="lrp-login-info">
                <strong>Demo Hesaplar</strong>
                <span>Admin: admin / 1234</span>
                <span>Öğrenci hesabı, atama yapıldığında öğrenci numarası ile oluşur.</span>
            </div>
        </section>
    </div>
    <script src="/auth.js"></script>
    <script src="/login.js"></script>
</body>
</html>
